# Server Configuration
server.port=8080
spring.application.name=truthlens-backend

# H2 Database Configuration (Persistent file-based database)
spring.datasource.url=jdbc:h2:file:./data/truthlensdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson Configuration
spring.jackson.serialization.indent_output=true

# Logging
logging.level.com.truthlens=INFO
logging.level.org.springframework.web=INFO
